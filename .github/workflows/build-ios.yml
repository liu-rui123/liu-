name: Build Kaka Calculator IPA

"on":
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source archive when needed
        shell: bash
        run: |
          if [ -f project.yml ]; then
            echo "Source files are already available."
            exit 0
          fi
          ARCHIVE_PATH=$(find . -maxdepth 1 -type f -name '卡卡计算器-GitHub构建源码*.zip' -print | sort -V | tail -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Missing project.yml and 卡卡计算器-GitHub构建源码.zip"
            exit 1
          fi
          ditto -x -k "$ARCHIVE_PATH" .
          test -f project.yml
          test -d LedgerCalc

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an iPhone simulator
        id: simulator
        shell: bash
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No iPhone simulator is available")
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project KakaCalculator.xcodeproj -scheme KakaCalculator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/TestDerivedData CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build -project KakaCalculator.xcodeproj -scheme KakaCalculator \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'KakaCalculator.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../KakaCalculator-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KakaCalculator-unsigned-IPA
          path: build/KakaCalculator-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
